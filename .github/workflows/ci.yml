name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run CI on"
        required: true
        default: "main"
        type: string
      python_versions:
        description: "Python versions to test (comma-separated)"
        required: false
        default: "3.10,3.11,3.12"
        type: string
      skip_mypy:
        description: "Skip mypy type check"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      python-matrix: ${{ steps.set.outputs.matrix }}
      ref: ${{ steps.set.outputs.ref }}
      skip_mypy: ${{ steps.set.outputs.skip_mypy }}

    steps:
      - name: Build matrix and ref
        id: set
        run: |
          # Определяем ветку/реф
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.branch }}"
            VERSIONS="${{ inputs.python_versions }}"
            SKIP_MYPY="${{ inputs.skip_mypy }}"
          else
            # Для push и PR берем текущую ветку
            REF="${{ github.ref_name }}"
            VERSIONS="3.10,3.11,3.12"
            SKIP_MYPY="false"
          fi

          # Формируем JSON массив для матрицы
          MATRIX=$(echo "$VERSIONS" | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          versions = [v.strip() for v in raw.split(',') if v.strip()]
          if not versions:
              versions = ['3.12'] # Fallback если список пуст
          print(json.dumps(versions))
          ")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "ref=$REF"       >> "$GITHUB_OUTPUT"
          echo "skip_mypy=$SKIP_MYPY" >> "$GITHUB_OUTPUT"

          echo "### CI targets" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`$REF\`"      >> "$GITHUB_STEP_SUMMARY"
          echo "- **Python:** \`$VERSIONS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skip Mypy:** \`$SKIP_MYPY\`" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    needs: resolve

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Mypy
        # Исправленное условие: пропускаем только если явно указано true в workflow_dispatch
        if: ${{ needs.resolve.outputs.skip_mypy != 'true' }}
        run: python -m mypy nano_vm/

  bare-install:
    name: Bare install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.resolve.outputs.python-matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # No extras, no [dev] — this is the exact command from README's
      # "pip install llm-nano-vm". Regression guard for the 2026-09
      # incident: adapters/__init__.py used to import litellm_adapter
      # eagerly, so `import nano_vm` raised ImportError on every install
      # without the [litellm] extra, and CI never caught it because every
      # other job installs `.[dev]` (which pulls litellm in transitively).
      - name: Install with NO extras
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Confirm litellm is genuinely absent
        run: |
          if python -c "import litellm" 2>/dev/null; then
            echo "::error::litellm is present in a job meant to test the bare install path — this job is not testing what it claims to."
            exit 1
          fi

      - name: Import smoke (no litellm installed)
        run: |
          python - <<'PY'
          import nano_vm

          print("nano_vm.__version__ =", nano_vm.__version__)
          assert nano_vm.__version__ not in ("0.7.0", "0.0.0+unknown"), (
              f"stale or unresolved __version__: {nano_vm.__version__!r}"
          )

          # Public API that must stay importable from the top-level package.
          # ProgramValidator/TraceAnalyzer/ExecutionReceipt were documented
          # flagship v0.8.5 features but missing from __all__ until 0.8.9.
          from nano_vm import (
              ExecutionReceipt,
              ExecutionVM,
              IssueKind,
              IssueSeverity,
              Program,
              ProgramValidator,
              RejectedTransition,
              TraceAnalyzer,
              TraceHealthReport,
              ValidationIssue,
              ValidationReport,
          )

          # base/mock adapters must not require litellm.
          from nano_vm.adapters import LLMAdapter, MockLLMAdapter

          # LiteLLMAdapter must still be reachable by name (lazy __getattr__,
          # PEP 562) and fail with ImportError only at first use, not at
          # `import nano_vm` time.
          try:
              from nano_vm.adapters import LiteLLMAdapter
              LiteLLMAdapter("openai/gpt-4o-mini")
          except ImportError as exc:
              print("LiteLLMAdapter correctly deferred ImportError:", exc)
          else:
              raise AssertionError(
                  "LiteLLMAdapter instantiated without litellm installed — "
                  "either litellm leaked into this environment, or the "
                  "lazy-import guard in nano_vm/adapters/__init__.py regressed."
              )

          print("bare-install smoke test: PASS")
          PY

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [resolve, lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.resolve.outputs.python-matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-timeout

      - name: Pytest + coverage
        run: |
          pytest \
            --timeout=10 \
            --cov=nano_vm \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            tests/

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
